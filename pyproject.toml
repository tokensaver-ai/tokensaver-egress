[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokensaver-egress"
dynamic = ["version"]
description = "TokenSaver egress capture proxy — MITM / explicit / transparent HTTPS capture for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TokenSaver" }]
keywords = ["tokensaver", "egress", "proxy", "mitm", "llm", "observability", "claude", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Internet :: Proxy Servers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[project.scripts]
tokensaver-egress = "tokensaver_egress.__main__:main"

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://platform.tokensaver.fr"
Documentation = "https://github.com/tokensaver-ai/tokensaver-egress"
Repository = "https://github.com/tokensaver-ai/tokensaver-egress"
PyPI = "https://pypi.org/project/tokensaver-egress/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokensaver_egress = [
    "py.typed",
    "claude_plugin/**/*",
    "claude_plugin/.claude-plugin/*",
    "claude_plugin/.mcp.json",
    "claude_plugin/hooks/*",
    "claude_plugin/commands/*",
    "claude_plugin/skills/**/*",
]

[tool.setuptools.dynamic]
version = { attr = "tokensaver_egress.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
